# Project values of the agent system (#905). The tools in tools/ read this file (framework/tools/agent_config.py).

repo = "Larspolo/travel-aggregator"
owners = ["Larspolo", "Jeroenvb3"]
branch = "main"

[status]
issue = 1
label = "agent-status"
paused = "paused"

[commands]                      # change these to the commands of the project
install = "python3 -m pip install --quiet --disable-pip-version-check --root-user-action=ignore -r requirements-dev.txt"
lint = "ruff check ."
fast = "python3 -m pytest -n auto"
slow = "python3 -m pytest -m slow"
server = ""
dev = "docker compose up --build"  # starts the development server on the owner's computer (the `try` skill); "" = none

[ci]                            # framework/tools/ship_pr.py
gates = ["browser", "docker", "production"]   # the PR jobs of ci.yml besides `quick`: Automerge needs all green (tests/test_ci_gates.py)

[git]                           # framework/tools/health.py, "Files that do not belong in git" (#853)
png_ok = ["docs/", "samples/", "app/web/static/"]   # the folders where a .png belongs (the app icons, #796)

[docs]
system = "framework/docs/SYSTEM.md"
steering = "framework/docs/STEERING.md"
learnings = "docs/LEARNINGS.md"
roadmap = "steering/project/ROADMAP.md"

[audience]                      # who answers a needs-human ticket: add one of these labels to each (#72)
for-lars = "Larspolo"           # the agent system: Claude, Docker, the server, CI, the GitHub settings
for-jeroen = "Jeroenvb3"        # the project: decisions, features, the roadmap, payload captures (#122)
