{% for fare in fares %}
<table class="history">
  <caption>{{ fare.source }}: {{ fare.fare_name or "" }}</caption>
  <tr><th>Captured</th><th>Price</th></tr>
  {% for p in fare.prices | sort(attribute="captured_at", reverse=true) %}
  <tr><td>{{ p.captured_at.strftime("%Y-%m-%d %H:%M") }}</td><td class="price">{{ p.currency }} {{ "%.2f" | format(p.price) }}</td></tr>
  {% endfor %}
</table>
{% endfor %}
