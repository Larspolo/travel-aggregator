{# The price against the door-to-door hours (#1858); an htmx swap of the table updates it out of band #}
<section class="price-hours card" id="price-hours"{% if oob %} hx-swap-oob="true"{% endif %}{% if not view.price_hours %} hidden{% endif %}>
{% if view.price_hours %}
<h2>Price and door-to-door hours</h2>
{% with chart = view.price_hours %}
<svg class="price-chart" viewBox="0 0 {{ chart.width }} {{ chart.height + 14 }}" width="100%" role="group"
     aria-label="Price against door-to-door hours; filled points: no faster offer for less">
  {% if chart.line %}<polyline fill="none" stroke="currentColor" stroke-width="1.5" points="{{ chart.line }}"/>{% endif %}
  {% for d in chart.dots %}
  <a href="#it-{{ d.id }}" aria-label="{{ d.title }}"><circle class="{{ 'marked' if d.marked else 'other' }}" cx="{{ d.x }}" cy="{{ d.y }}" r="4"><title>{{ d.title }}</title></circle></a>
  {% endfor %}
  <text x="0" y="{{ chart.height + 12 }}" font-size="10">{{ chart.low_hours }} · {{ chart.low_price | money(chart.currency) }} to {{ chart.high_price | money(chart.currency) }}</text>
  <text x="{{ chart.width }}" y="{{ chart.height + 12 }}" font-size="10" text-anchor="end">{{ chart.high_hours }}</text>
</svg>
{% endwith %}
{% endif %}
</section>
