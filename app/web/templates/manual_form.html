<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>New offer – travel-aggregator</title></head>
<body>
<h1>New offer</h1>
{% if errors %}<ul class="errors">{% for e in errors %}<li>{{ e }}</li>{% endfor %}</ul>{% endif %}
<form method="post" action="/trips/{{ trip_id }}/offers/new">
  <input type="hidden" name="csrf_token" value="{{ csrf_token(request) }}">
  <p><label>Price <input name="price_amount" required inputmode="decimal" value="{{ values.price_amount or '' }}"></label>
     <label>Currency <input name="price_currency" maxlength="3" value="{{ values.price_currency or 'EUR' }}"></label></p>
  <p><label>Fare name <input name="fare_name" maxlength="100" value="{{ values.fare_name or '' }}"></label></p>
  <p><label>UTC offset of the times <input name="utc_offset" pattern="[+-][0-9]{2}:[0-9]{2}" value="{{ values.utc_offset or '+01:00' }}"></label></p>
  {% for i in legs %}
  <fieldset><legend>Leg {{ i + 1 }}{% if i > 0 %} (optional){% endif %}</legend>
    <label>Mode <select name="leg{{ i }}_mode">
      {% for m in modes %}<option value="{{ m }}"{% if values['leg%d_mode' % i] == m %} selected{% endif %}>{{ m }}</option>{% endfor %}
    </select></label>
    <label>From <input name="leg{{ i }}_from_name" maxlength="200" value="{{ values['leg%d_from_name' % i] or '' }}"></label>
    <label>To <input name="leg{{ i }}_to_name" maxlength="200" value="{{ values['leg%d_to_name' % i] or '' }}"></label>
    <label>Departure <input type="datetime-local" name="leg{{ i }}_depart_at" value="{{ values['leg%d_depart_at' % i] or '' }}"></label>
    <label>Arrival <input type="datetime-local" name="leg{{ i }}_arrive_at" value="{{ values['leg%d_arrive_at' % i] or '' }}"></label>
  </fieldset>
  {% endfor %}
  <p><button type="submit">Save</button> <a href="/trips/{{ trip_id }}">Cancel</a></p>
</form>
</body>
</html>
