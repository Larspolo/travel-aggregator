# nginx in front of travel-aggregator (deploy/production). Copy to /etc/nginx/conf.d/travel-aggregator.conf on the server.
# Change only the two server_name lines and the certificate paths: travel.example.com -> your own host.
# The certificate files come from your own tool (for example certbot). Then run: nginx -t && systemctl reload nginx

server {
    listen 80;
    server_name travel.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name travel.example.com;

    ssl_certificate     /etc/letsencrypt/live/travel.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/travel.example.com/privkey.pem;

    # The captures of POST /api/ingest can be big.
    client_max_body_size 10m;

    location / {
        # All paths, /api too: the app has its own login, and the userscript sends its own Bearer token.
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
