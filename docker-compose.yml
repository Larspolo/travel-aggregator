# A local run of travel-aggregator (`docker compose up --build`, the `dev` command of agent.toml).
# Settings in .env (copy .env.example). The preview server uses deploy/preview/ with the image from GHCR.
services:
  app:
    build:
      context: .
      args:
        GIT_SHA: ${GIT_SHA:-dev}
    restart: unless-stopped
    env_file: .env
    volumes:
      - backups:/backups
    ports:
      - "${APP_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy

  # A daily dump of the database to the backups volume (`python -m app.backup --daily`; no cron needed).
  backup:
    build:
      context: .
      args:
        GIT_SHA: ${GIT_SHA:-dev}
    restart: unless-stopped
    env_file: .env
    command: python -m app.backup --daily
    volumes:
      - backups:/backups
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16
    restart: unless-stopped
    env_file: .env
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      retries: 10

volumes:
  db:
  backups:
