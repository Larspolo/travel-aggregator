name: CI

# Quick checks on each PR and on main: Automerge merges a green agent PR (workflow name "CI", job "quick").
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quick:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:                 # the test database (CLAUDE.md, "Commands")
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U test" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://test:test@localhost:5432/test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 -m pip install --quiet --disable-pip-version-check --root-user-action=ignore -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Fast tests
        run: python3 -m pytest -n auto

  # The image: build it, start it with no database (before the migrations exist) and check /api/health. The cloud
  # sessions have no Docker daemon, so this job is the check of Dockerfile and docker-entrypoint.sh.
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker build --build-arg GIT_SHA=${{ github.sha }} -t travel-aggregator:ci .
      - name: Start and check /api/health
        run: |
          docker run -d --name app -p 8000:8000 travel-aggregator:ci
          for i in $(seq 30); do curl -fsS http://127.0.0.1:8000/api/health && break; sleep 1; done
          curl -fsS http://127.0.0.1:8000/api/health | grep -q '"commit":"${{ github.sha }}"'
          [ "$(docker exec app id -u)" != 0 ]          # not root
          for i in $(seq 40); do [ "$(docker inspect -f '{{.State.Health.Status}}' app)" = healthy ] && break; sleep 2; done
          docker inspect -f '{{.State.Health.Status}}' app | grep -qx healthy
      - if: failure()
        run: docker logs app || true
