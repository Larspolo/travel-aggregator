name: CI

# Quick checks on each PR and on main: Automerge merges a green agent PR (workflow name "CI", job "quick", 2 parts).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Two jobs, each with one part of the fast tests (whole files, tests/shard.py): one job took 122 s for the step
  # `Fast tests` after #1074, and the CI wait of each PR is this job (#1077). The check runs are `quick (1)` and
  # `quick (2)`: each reader of the check `quick` takes both parts as one check, green only when both parts are green
  # (`quick_run` of framework/tools/ship_pr.py, its QUICK_PARTS, and GREEN of automerge.yml). Part 1 also runs the lint.
  quick:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    services:
      postgres:                 # the test database (CLAUDE.md, "Commands")
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U test" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://test:test@localhost:5432/test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 -m pip install --quiet --disable-pip-version-check --root-user-action=ignore -r requirements-dev.txt
      - name: Lint
        if: matrix.shard == 1
        run: ruff check .
      - name: Fast tests   # the 25 slowest tests of the part in the log (#1070)
        run: python3 -m pytest -n auto --shard ${{ matrix.shard }}/2 --durations=25

  # The browser tests (`pytest -m slow`, about 20 s): each page at 390 px and 1280 px with no sideways scroll, the phone
  # check with touch (tests/test_mobile_touch.py), and the userscripts on local test pages (never a travel site, P1).
  # They gate each PR: no person checks what this job can check (owner, 2026-11-07). The job is not named `slow`,
  # because the pacer and Automerge do not count a job `slow` (#5462).
  # Two jobs, each with one part of the slow tests (whole files, tests/shard.py): one job took 3.0 min (median of 100
  # PRs) and the merge of each PR waits for it (#1062). The check runs are `browser (1)` and `browser (2)`: the gate
  # `browser` of agent.toml covers both (framework/tools/ship_pr.py).
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U test" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://test:test@localhost:5432/test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 -m pip install --quiet --disable-pip-version-check --root-user-action=ignore -r requirements-dev.txt
      - name: Install the system packages of the browser
        # apt of the runner lost DNS for 2 hours on 2026-11-11 (#2325): 20 s for each lookup, 9 min for each install.
        # The runner image has the libraries; apt adds only fonts. Limit the time and continue with a warning.
        run: >-
          timeout 180 python3 -m playwright install-deps chromium
          || echo "::warning::playwright install-deps failed or took more than 180 s; the tests use the packages of the runner"
      - name: Install Playwright browser
        # Retry: a short network failure must not fail the job (#2325). The browser comes from the Playwright CDN.
        run: |
          for attempt in 1 2 3; do
            python3 -m playwright install chromium && exit 0
            [ "$attempt" = 3 ] && break
            wait=$((attempt * 15))
            echo "Install failed (attempt $attempt); retry in $wait s"
            sleep "$wait"
          done
          exit 1
      - name: Browser tests
        run: python3 -m pytest -m slow -n auto --shard ${{ matrix.shard }}/2 --durations=10
        env:
          SCREENSHOT_DIR: screenshots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots-${{ matrix.shard }}
          path: screenshots/
          if-no-files-found: ignore

  # The local run as the owner starts it (`docker compose up --build`, the `dev` command): docker-compose.yml with
  # .env.example, the db container, the migrations at the start, then /api/health (the commit), the non-root user,
  # the healthcheck, and the login with the CSRF token up to the trips list. The cloud sessions have no Docker daemon,
  # so this job is the check of Dockerfile, docker-entrypoint.sh and docker-compose.yml (#63).
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GIT_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - name: docker compose up --build
        run: |
          cp .env.example .env
          scripts/retry.sh docker compose pull --ignore-buildable  # a reset of Docker Hub (#509, #615)
          for image in $(awk '/^FROM/ {print $2}' Dockerfile | sort -u); do scripts/retry.sh docker pull "$image"; done
          docker compose up --build -d
          for i in $(seq 60); do curl -fsS http://127.0.0.1:8000/api/health && break; sleep 2; done
          curl -fsS http://127.0.0.1:8000/api/health | grep -q "\"commit\":\"$GIT_SHA\""
          [ "$(docker compose exec -T app id -u)" != 0 ]          # not root
          app=$(docker compose ps -q app)
          for i in $(seq 40); do [ "$(docker inspect -f '{{.State.Health.Status}}' "$app")" = healthy ] && break; sleep 2; done
          docker inspect -f '{{.State.Health.Status}}' "$app" | grep -qx healthy
      - name: Log in and see the trips list
        run: |
          hash=$(docker compose exec -T app python -m app.auth 'ci-password')
          sed -i '/^OWNER_PASSWORD_HASH=/d' .env && printf "OWNER_PASSWORD_HASH='%s'\n" "$hash" >> .env
          docker compose up -d
          for i in $(seq 60); do curl -fsS http://127.0.0.1:8000/api/health >/dev/null && break; sleep 2; done
          token=$(curl -fsS -c jar http://127.0.0.1:8000/login | sed -n 's/.*name="csrf_token" value="\([^"]*\)".*/\1/p')
          [ -n "$token" ]
          code=$(curl -s -o /dev/null -w '%{http_code}' -b jar -c jar --data-urlencode "csrf_token=$token" \
            --data-urlencode "password=ci-password" http://127.0.0.1:8000/login)
          [ "$code" = 303 ]
          curl -fsS -b jar http://127.0.0.1:8000/ | grep -q "<h1>Trips</h1>"
      - if: failure()
        run: docker compose logs --tail 40 || true

  # The criterion of host:deploy (#88): the production compose (deploy/production) starts behind the Caddy example
  # (deploy/caddy) and answers over HTTPS. The image is built here and tagged :latest, so the job pulls no app image.
  # Caddy gets `tls internal` and the host localhost in the job only. It sends no request to a travel site (P1).
  production:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      IMAGE: ghcr.io/larspolo/travel-aggregator:latest
    steps:
      - uses: actions/checkout@v4
      - name: Pull the images (a reset of Docker Hub, #615)
        run: |
          for image in $(awk '/^FROM/ {print $2}' Dockerfile | sort -u) caddy:2; do scripts/retry.sh docker pull "$image"; done
      - name: Build the image as :latest
        run: docker build --build-arg GIT_SHA=${{ github.sha }} -t "$IMAGE" .
      - name: Start the production compose
        working-directory: deploy/production
        run: |
          cp .env.example .env
          sed -i 's/change-me/ci-secret/g; /^OWNER_PASSWORD_HASH=/d' .env
          hash=$(docker run --rm --entrypoint python "$IMAGE" -m app.auth 'ci-password')
          printf "OWNER_PASSWORD_HASH='%s'\n" "$hash" >> .env
          ../../scripts/retry.sh docker compose pull db
          docker compose up -d app db   # the pull policy "missing" keeps the local :latest
          for i in $(seq 60); do curl -fsS http://127.0.0.1:8000/api/health >/dev/null && break; sleep 2; done
      - name: Start Caddy with the example Caddyfile
        run: |
          sed 's/^travel\.example\.com {/localhost {\n\ttls internal/' deploy/caddy/Caddyfile > "$RUNNER_TEMP/Caddyfile"
          cat "$RUNNER_TEMP/Caddyfile"
          docker run -d --name caddy --network host -v "$RUNNER_TEMP/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2
      - name: Health over HTTPS, and a redirect to the login
        run: |
          for i in $(seq 30); do curl -fsS --insecure https://localhost/api/health && break; sleep 2; done
          curl -fsS --insecure https://localhost/api/health | grep -q '"status":"ok"'
          out=$(curl -s --insecure -o /dev/null -w '%{http_code} %{redirect_url}' https://localhost/)
          echo "$out"
          [ "$out" = "303 https://localhost/login" ]
      - if: failure()
        run: |
          (cd deploy/production && docker compose logs --tail 40) || true
          docker logs --tail 40 caddy || true

  # The preview image: after green checks on main, push ghcr.io/larspolo/travel-aggregator:preview (and :sha-<commit>);
  # the owner's server runs it (deploy/preview/, watchtower within 5 minutes). It is a job of CI, not a workflow of its
  # own: Automerge merges with GITHUB_TOKEN and starts CI on main itself, and a run of GITHUB_TOKEN starts no
  # workflow_run of another workflow. Only the newest commit of main pushes :preview, so an old run that ends late
  # cannot replace a newer image. A start by hand: Actions, CI, "Run workflow" on main.
  # GitHub Actions terms: this is the publication of the project. It sends no request to a travel site (P1).
  preview:
    needs: [quick, docker]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
      actions: write   # the gate starts ci.yml for a newer head with no run (#2175)
    concurrency:
      group: preview-image
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Skip an old commit
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          R="${{ github.repository }}"
          head=$(gh api "repos/$R/commits/main" --jq .sha)
          if [ "$head" != "$GITHUB_SHA" ]; then
            echo "main is at $head now: skip $GITHUB_SHA."; echo "go=false" >> "$GITHUB_OUTPUT"
            # Two merges seconds apart: both dispatches can get the old ref, and then no run has the head (#2175).
            runs=$(gh api "repos/$R/actions/workflows/ci.yml/runs?head_sha=$head" --jq .total_count)
            if [ "$runs" = "0" ]; then echo "No CI run of $head: start one."; gh workflow run ci.yml --repo "$R" --ref main; fi
          else echo "go=true" >> "$GITHUB_OUTPUT"; fi
      - if: steps.gate.outputs.go == 'true'
        uses: docker/setup-buildx-action@v3
      - if: steps.gate.outputs.go == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - if: steps.gate.outputs.go == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: GIT_SHA=${{ github.sha }}   # /api/health shows it
          tags: |
            ghcr.io/larspolo/travel-aggregator:preview
            ghcr.io/larspolo/travel-aggregator:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
