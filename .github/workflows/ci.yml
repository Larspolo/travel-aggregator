name: CI

# Quick checks on each PR and on main: Automerge merges a green agent PR (workflow name "CI", job "quick").
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quick:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:                 # the test database (CLAUDE.md, "Commands")
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U test" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://test:test@localhost:5432/test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 -m pip install --quiet --disable-pip-version-check --root-user-action=ignore -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Fast tests
        run: python3 -m pytest -n auto

  # The image: build it, start it with a PostgreSQL 16 container as on the server (the start runs the migrations), and
  # check /api/health. The cloud sessions have no Docker daemon, so this job is the check of Dockerfile and
  # docker-entrypoint.sh.
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker build --build-arg GIT_SHA=${{ github.sha }} -t travel-aggregator:ci .
      - name: Start and check /api/health
        run: |
          docker network create ci
          docker run -d --name db --network ci -e POSTGRES_USER=test -e POSTGRES_PASSWORD=test -e POSTGRES_DB=test postgres:16
          for i in $(seq 30); do docker exec db pg_isready -U test -d test -h 127.0.0.1 && break; sleep 1; done
          docker run -d --name app --network ci -p 8000:8000 \
            -e DATABASE_URL=postgresql+psycopg://test:test@db:5432/test travel-aggregator:ci
          for i in $(seq 30); do curl -fsS http://127.0.0.1:8000/api/health && break; sleep 1; done
          curl -fsS http://127.0.0.1:8000/api/health | grep -q '"commit":"${{ github.sha }}"'
          [ "$(docker exec app id -u)" != 0 ]          # not root
          for i in $(seq 40); do [ "$(docker inspect -f '{{.State.Health.Status}}' app)" = healthy ] && break; sleep 2; done
          docker inspect -f '{{.State.Health.Status}}' app | grep -qx healthy
      - if: failure()
        run: docker logs app || true; docker logs db | tail -20 || true

  # The preview image: after green checks on main, push ghcr.io/larspolo/travel-aggregator:preview (and :sha-<commit>);
  # the owner's server runs it (deploy/preview/, watchtower within 5 minutes). It is a job of CI, not a workflow of its
  # own: Automerge merges with GITHUB_TOKEN and starts CI on main itself, and a run of GITHUB_TOKEN starts no
  # workflow_run of another workflow. Only the newest commit of main pushes :preview, so an old run that ends late
  # cannot replace a newer image. A start by hand: Actions, CI, "Run workflow" on main.
  # GitHub Actions terms: this is the publication of the project. It sends no request to a travel site (P1).
  preview:
    needs: [quick, docker]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    concurrency:
      group: preview-image
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Skip an old commit
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          head=$(gh api "repos/${{ github.repository }}/commits/main" --jq .sha)
          if [ "$head" != "$GITHUB_SHA" ]; then echo "main is at $head now: skip $GITHUB_SHA."; echo "go=false" >> "$GITHUB_OUTPUT"
          else echo "go=true" >> "$GITHUB_OUTPUT"; fi
      - if: steps.gate.outputs.go == 'true'
        uses: docker/setup-buildx-action@v3
      - if: steps.gate.outputs.go == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - if: steps.gate.outputs.go == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: GIT_SHA=${{ github.sha }}   # /api/health shows it
          tags: |
            ghcr.io/larspolo/travel-aggregator:preview
            ghcr.io/larspolo/travel-aggregator:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
