name: Preview image

# After each green CI on main: build the image and push ghcr.io/larspolo/travel-aggregator:preview (and :sha-<commit>).
# The owner's server runs the preview from it (deploy/preview/): its watchtower pulls the new image within 5 minutes.
# Only the newest commit of main pushes :preview, so an old run that ends late cannot replace a newer image.
# GitHub Actions terms: this is the publication of the project. It sends no request to a travel site (P1).
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  packages: write

concurrency:
  group: preview-image
  cancel-in-progress: false

jobs:
  image:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Skip until the Dockerfile exists, and skip an old commit
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          head=$(gh api "repos/${{ github.repository }}/commits/main" --jq .sha)
          if [ ! -f Dockerfile ]; then echo "No Dockerfile yet (capture:skeleton adds it)."; echo "go=false" >> "$GITHUB_OUTPUT"
          elif [ "$head" != "$SHA" ]; then echo "main is at $head now: skip $SHA."; echo "go=false" >> "$GITHUB_OUTPUT"
          else echo "go=true" >> "$GITHUB_OUTPUT"; fi
      - if: steps.gate.outputs.go == 'true'
        uses: docker/setup-buildx-action@v3
      - if: steps.gate.outputs.go == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - if: steps.gate.outputs.go == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: GIT_SHA=${{ github.event.workflow_run.head_sha }}   # /api/health shows it
          tags: |
            ghcr.io/larspolo/travel-aggregator:preview
            ghcr.io/larspolo/travel-aggregator:sha-${{ github.event.workflow_run.head_sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
